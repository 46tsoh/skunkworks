name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    name: pytest (py${{ matrix.python-version }})
    # ubuntu-22.04 ships prebuilt CPython 3.9 (ubuntu-latest / 26.04 does not).
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (editable, with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run test suite with coverage gate
        run: pytest --cov=aegis --cov-report=term-missing --cov-fail-under=80

  ui-build:
    name: dashboard build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI deps
        working-directory: ui
        run: npm ci
      - name: Build dashboard
        working-directory: ui
        run: npm run build
