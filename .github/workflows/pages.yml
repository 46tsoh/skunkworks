name: Deploy demo to GitHub Pages

# Publishes the self-contained demo/ pages (e.g. demo/aegis-tour.html) as the
# GitHub Pages site, so the animated tour is viewable live at
#   https://<owner>.github.io/<repo>/aegis-tour.html
#
# One-time setup by a repo admin: Settings → Pages → Source: "GitHub Actions".
# After that, every push to main that touches demo/ redeploys automatically.

on:
  push:
    branches: [main]
    paths: ["demo/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deploy; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo
      - id: deployment
        uses: actions/deploy-pages@v4
